# SGX Scalping Bot — example configuration
# Copy to config.yaml and fill in your Tiger Brokers credentials for live/sandbox mode.

broker:
  mode: paper             # "paper" | "sandbox" | "live"
  tiger_id: ""            # your Tiger Brokers user ID
  account_id: ""          # trading account ID
  private_key_path: ""    # path to RSA private key PEM file
  region: SG

strategy:
  min_spread_ticks: 2     # must see at least 2-tick spread to enter
  target_profit_ticks: 1  # exit when price moves 1 tick in our favour
  stop_loss_ticks: 3      # cut loss after 3 ticks against us
  max_hold_seconds: 60    # force exit after 60 seconds regardless
  min_volume: 500000      # skip illiquid stocks
  momentum_period: 5      # use last 5 ticks to gauge direction
  tick_interval_ms: 500   # poll quotes every 500 ms

risk:
  max_position_sgd: 5000    # max SGD per individual position
  max_daily_loss_sgd: 200   # stop trading for the day after this loss
  max_open_positions: 3     # concurrent open positions
  min_commission_sgd: 10.0  # Tiger Brokers SGX minimum commission
  commission_rate: 0.0008   # 0.08% of trade value
  max_trades_per_day: 50

# SGX-listed symbols to watch (Yahoo Finance format: TICKER.SI)
watchlist:
  - D05.SI   # DBS Group Holdings
  - O39.SI   # OCBC Bank
  - U11.SI   # United Overseas Bank
  - Z74.SI   # Singtel
  - F34.SI   # Wilmar International
  - BN4.SI   # Keppel Corporation
  - C6L.SI   # Singapore Airlines
  - V03.SI   # Venture Corporation
