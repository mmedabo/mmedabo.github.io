# Moomoo SGX Scalping Bot — configuration
# Capital: S$1,000 per day. Target low-value SGX stocks (price ≤ S$3.00).
# Start MoomooOpenD on your machine first, then run: python main.py

opend:
  host: "127.0.0.1"
  port: 11111
  trade_env: "SIMULATE"   # "SIMULATE" for paper trading, "REAL" for live

strategy:
  min_spread_ticks: 2      # minimum bid-ask spread in ticks to enter
  target_profit_ticks: 4   # ticks of profit to exit at target
  stop_loss_ticks: 3       # ticks to cut loss
  max_hold_seconds: 120    # force-exit after N seconds
  min_volume: 1000000      # require ≥1M daily volume for liquidity
  momentum_period: 5       # number of ticks to measure momentum
  poll_interval_sec: 0.5   # how often to poll quotes
  max_price_sgd: 3.00      # screener: skip stocks above this price
  # --- smarter selection ---
  max_candidates: 6        # only trade top-N from screener (≈ max_open × 2); 0 = all
  cooldown_seconds: 300    # seconds before re-entering same symbol after any exit
  min_atr_ticks: 2         # skip entry if recent price range < N ticks (too flat)
  max_atr_ticks: 12        # skip entry if recent price range > N ticks (too volatile)
  warmup_minutes: 15       # skip entries in first 15 min of each session

risk:
  total_capital_sgd: 1000   # total daily capital funded into the broker account
  max_position_sgd: 333     # max SGD per single position (total / max_open_positions)
  max_daily_loss_sgd: 80    # halt after losing 8% of capital (~4 bad stops)
  max_open_positions: 3     # spread capital across up to 3 simultaneous positions
  max_trades_per_day: 30    # ~10 full cycles × 3 concurrent positions
  commission_rate: 0.0003   # 0.03% — Moomoo SG commission
  min_commission_sgd: 0.99  # Moomoo SG min per trade

# Curated low-value SGX watchlist — all priced under S$3, liquid (≥1M vol/day).
