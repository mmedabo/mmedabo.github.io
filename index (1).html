function makePoolMatches(poolIdx, teams) {
  // Verified optimal 5-team schedule. Min gap = 2 for every team (proven mathematical maximum).
  // Structured as 5 rounds of 2 matches each — one team gets a full round bye per round.
  // Round 1: T0 rests | Round 2: T1 rests | Round 3: T4 rests | Round 4: T3 rests | Round 5: T2 rests
  const ROUNDS = [
    { bye:0, matches:[[2,4],[1,3]] },
    { bye:1, matches:[[0,2],[3,4]] },
    { bye:4, matches:[[0,1],[2,3]] },
    { bye:3, matches:[[0,4],[1,2]] },
    { bye:2, matches:[[0,3],[1,4]] },
  ];
  const result = [];
  let idx = 0;
  ROUNDS.forEach((round, ri) => {
    round.matches.forEach(([t1,t2]) => {
      result.push({
        id: `P${poolIdx}-${idx}`,
        pool: poolIdx,
        t1, t2,
        s1: null, s2: null,
        status: "pending",
        slot: idx + 1,
        round: ri + 1,
        byeTeam: round.bye,
      });
      idx++;
    });
  });
  return result;
}

function computeStandings(teams, matches) {
  const stat = teams.map((name,i) => ({ idx:i, name, W:0, L:0, PF:0, PA:0, GP:0 }));
  (matches||[]).forEach(m => {
    if (m.status!=="done") return;
    stat[m.t1].PF+=m.s1; stat[m.t1].PA+=m.s2; stat[m.t1].GP++;
    stat[m.t2].PF+=m.s2; stat[m.t2].PA+=m.s1; stat[m.t2].GP++;
    if (m.s1>m.s2){stat[m.t1].W++;stat[m.t2].L++;}
    else{stat[m.t2].W++;stat[m.t1].L++;}
  });
  return stat.sort((a,b)=>b.W-a.W||(b.PF-b.PA)-(a.PF-a.PA));
}

function syncToFirebase(data) { if (db) set(ref(db,"tournament"), data); }
function syncTeamsData() { if (db) set(ref(db,"teamsData"), state.teamsData); }

function startFirebaseListener() {
  if (!db) return;
  let tournamentLoaded = false;
  let teamsDataLoaded = false;

  function tryRender() {
    // Only render once both listeners have fired at least once
    if (tournamentLoaded && teamsDataLoaded) render();
  }

  onValue(ref(db,"tournament"), snap => {
    const data = snap.val();
    // Preserve mid-edit values
    if (state.editingMatch) {
      const v1 = document.getElementById(`s1_${state.editingMatch}`);
      const v2 = document.getElementById(`s2_${state.editingMatch}`);
      if (v1) state.editScores.s1 = v1.value;
      if (v2) state.editScores.s2 = v2.value;
    }
    if (state.koEditing) {
      const v1 = document.getElementById(`ko_s1_${state.koEditing}`);
      const v2 = document.getElementById(`ko_s2_${state.koEditing}`);
      if (v1) state.koScores.s1 = v1.value;
      if (v2) state.koScores.s2 = v2.value;
    }
    if (data) {
      state.pools = data.pools;
      state.phase = data.phase || "pool";
      // Sync teamNames from live pools.teams so setup tab shows correct names
      if (data.pools?.teams) {
        state.teamNames = data.pools.teams.map(p => [...p]);
      }
    }
    tournamentLoaded = true;
    tryRender();
  });

  onValue(ref(db,"teamsData"), snap => {
    const data = snap.val();
    if (data) {
      state.teamsData = data;
      // Also push saved team names back into pools.teams and teamNames
      data.forEach((poolTeams, pi) => {
        (poolTeams || []).forEach((team, ti) => {
          const name = team?.teamName?.trim();
          if (name) {
            state.teamNames[pi] = state.teamNames[pi] || [];
            state.teamNames[pi][ti] = name;
            if (state.pools?.teams?.[pi]) state.pools.teams[pi][ti] = name;
          }
        });
      });
    }
    teamsDataLoaded = true;
    tryRender();
  });
}

/* ══════════════════════════════════════════════════════════════════════════

══════════════════════════════════════════════════════════════════════════ */
function startTournament() {
  const teams = state.teamNames.map(p=>p.map(t=>t.trim()||"TBD"));
  const matches = teams.map((p,pi)=>makePoolMatches(pi,p));
  const koMatches = {
    qf: Array(4).fill(null).map((_,i)=>({id:`qf${i}`,t1:null,t2:null,s1:null,s2:null,status:"pending"})),
    sf: Array(2).fill(null).map((_,i)=>({id:`sf${i}`,t1:null,t2:null,s1:null,s2:null,status:"pending"})),
    final: [{id:"final",t1:null,t2:null,s1:null,s2:null,status:"pending"}],
  };
  state.pools = { teams, matches, koMatches };
  state.phase = "pool"; state.tab = "pools";
  syncToFirebase({ pools: state.pools, phase: state.phase });
  startFirebaseListener();
  render();
}

function savePoolScore(poolIdx, matchId, s1, s2) {
  state.pools.matches[poolIdx] = state.pools.matches[poolIdx].map(m=>
    m.id!==matchId ? m : {...m, s1, s2, status:"done"}
  );
  state.editingMatch = null;
  syncToFirebase({ pools: state.pools, phase: state.phase });
  render();
}

function toggleLive(poolIdx, matchId) {
  state.pools.matches[poolIdx] = state.pools.matches[poolIdx].map(m=>
    m.id!==matchId ? m : {...m, status: m.status==="live" ? "pending" : "live"}
  );
  syncToFirebase({ pools: state.pools, phase: state.phase });
  render();
}

function resetPoolMatch(poolIdx, matchId) {
  state.pools.matches[poolIdx] = state.pools.matches[poolIdx].map(m=>
    m.id!==matchId ? m : {...m, s1:null, s2:null, status:"pending"}
  );
  state.editingMatch = null;
  syncToFirebase({ pools: state.pools, phase: state.phase });
  render();
}

function advanceToKnockout() {
  const QF_SEEDS = [
    {p1:0,r1:0,p2:3,r2:1},{p1:1,r1:0,p2:2,r2:1},
    {p1:2,r1:0,p2:1,r2:1},{p1:3,r1:0,p2:0,r2:1},
  ];
  const qual = POOL_NAMES.map((_,pi)=>computeStandings(state.pools.teams[pi], state.pools.matches[pi]).slice(0,2));
  state.pools.koMatches.qf = QF_SEEDS.map((s,i)=>({
    id:`qf${i}`, t1:qual[s.p1]?.[s.r1]?.name||"TBD", t2:qual[s.p2]?.[s.r2]?.name||"TBD",
    s1:null, s2:null, status:"pending",
  }));
  state.phase = "knockout"; state.tab = "knockout";
  syncToFirebase({ pools: state.pools, phase: state.phase });
  render();
}

function saveKOScore(stage, id, s1, s2) {
  state.pools.koMatches[stage] = state.pools.koMatches[stage].map(m=>
    m.id!==id ? m : {...m, s1, s2, status:"done"}
  );
  if (stage==="qf") {
    const done = state.pools.koMatches.qf.filter(m=>m.status==="done");
    if (done.length===4) {
      const w = done.map(m=>m.s1>m.s2?m.t1:m.t2);
      state.pools.koMatches.sf = [
        {id:"sf0",t1:w[0],t2:w[1],s1:null,s2:null,status:"pending"},
        {id:"sf1",t1:w[2],t2:w[3],s1:null,s2:null,status:"pending"},
      ];
    }
  }
  if (stage==="sf") {
    const done = state.pools.koMatches.sf.filter(m=>m.status==="done");
    if (done.length===2) {
      const w = done.map(m=>m.s1>m.s2?m.t1:m.t2);
      state.pools.koMatches.final = [{id:"final",t1:w[0],t2:w[1],s1:null,s2:null,status:"pending"}];
    }
  }
  state.koEditing = null;
  syncToFirebase({ pools: state.pools, phase: state.phase });
  render();
}

function resetKOMatch(stage, id) {
  state.pools.koMatches[stage] = state.pools.koMatches[stage].map(m=>
    m.id!==id ? m : {...m, s1:null, s2:null, status:"pending"}
  );
  state.koEditing = null;
  syncToFirebase({ pools: state.pools, phase: state.phase });
  render();
}

/* ══════════════════════════════════════════════════════════════════════════
   RENDER — POOL CARD (shared, admin flag gates editing)
══════════════════════════════════════════════════════════════════════════ */
function poolCardHTML(pi) {
  const color   = POOL_COLORS[pi];
  const teams   = state.pools.teams[pi];
  const matches = state.pools.matches[pi];
  const stand   = computeStandings(teams, matches);
  const done    = matches.filter(m=>m.status==="done").length;
  const admin   = isAdmin();

  const rows = stand.map((s,rank)=>`
    <tr class="${rank<2?"qualify":""}">
      <td><span class="rank-dot" style="${rank<2?`background:${color}22;color:${color}`:"color:#5A7A5E"}">${rank+1}</span></td>
      <td>
        <span ${isMyTeam(s.name)?`style="color:#FF6B3D;font-weight:600"`:""}>${isMyTeam(s.name)?"★ ":""}${esc(s.name)}</span>
        ${rank<2?`<span class="qualify-pill">QF</span>`:""}
      </td>
      <td style="color:${color}">${s.W}</td>
      <td style="color:#5A7A5E">${s.L}</td>
      <td style="color:${s.PF-s.PA>=0?"#27AE60":"#FF6B3D"};font-size:.8rem">${s.PF-s.PA>0?"+":""}${s.PF-s.PA}</td>
    </tr>`).join("");

  // Group matches by round and build display
  const matchesByRound = {};
  matches.forEach(m => {
    if (!matchesByRound[m.round]) matchesByRound[m.round] = [];
    matchesByRound[m.round].push(m);
  });

  const matchRows = Object.entries(matchesByRound).map(([roundNum, roundMatches]) => {
    const byeTeam = roundMatches[0].byeTeam;
    const byeName = teams[byeTeam] || `Team ${byeTeam+1}`;
    const byeIsMine = isMyTeam(byeName);

    const matchBlocks = roundMatches.map(m => {
      const t1=teams[m.t1], t2=teams[m.t2];
      const w1=m.status==="done"&&m.s1>m.s2, w2=m.status==="done"&&m.s2>m.s1;
      const mine=isMyTeam(t1)||isMyTeam(t2);
      const isEd=state.editingMatch===m.id;

      let scoreHTML;
      if (!admin) {
        scoreHTML = m.status==="done"
          ? `<span class="score-done">${m.s1}–${m.s2}</span>`
          : m.status==="live"
            ? `<span class="live-pill">LIVE</span>`
            : `<span class="pending-pill">Upcoming</span>`;
      } else if (isEd) {
        scoreHTML = `<div class="score-box">
          <input class="score-inp" id="s1_${m.id}" type="number" min="0" value="${state.editScores.s1}" placeholder="0"/>
          <span class="score-dash">–</span>
          <input class="score-inp" id="s2_${m.id}" type="number" min="0" value="${state.editScores.s2}" placeholder="0"/>
          <button class="btn btn-save" onclick="submitPoolScore('${pi}','${m.id}')">✓</button>
          <button class="btn btn-cancel" onclick="cancelEdit()">✕</button>
        </div>`;
      } else if (m.status==="done") {
        scoreHTML = `<div class="score-box">
          <span class="score-done">${m.s1}–${m.s2}</span>
          <button class="btn btn-ghost" onclick="startEdit('${pi}','${m.id}',${m.s1},${m.s2})">Edit</button>
          <button class="btn btn-reset" title="Reset match" onclick="if(confirm('Reset this match to unplayed?'))resetPoolMatch(${pi},'${m.id}')">↺</button>
        </div>`;
      } else if (m.status==="live") {
        scoreHTML = `<div class="score-box">
          <button class="btn btn-go" onclick="startEdit('${pi}','${m.id}','','')">Score</button>
          <button class="btn btn-reset" title="Reset to pending" onclick="resetPoolMatch(${pi},'${m.id}')">↺</button>
        </div>`;
      } else {
        scoreHTML = `<div class="score-box">
          <button class="btn btn-go" onclick="toggleLive(${pi},'${m.id}')">▶ Start</button>
        </div>`;
      }

      return `
        <div class="match-block ${mine?"match-mine":""} ${m.status==="done"?"match-done":""}">
          <div class="match-row">
            <span class="slot-num">${m.slot}</span>
            <span class="status-dot dot-${m.status}"></span>
            <div class="match-teams">
              <span class="match-team-name ${w1?"won":w2?"lost":""}" ${isMyTeam(t1)?`style="color:#FF6B3D"`:""}>${isMyTeam(t1)?"★ ":""}${esc(t1)}</span>
              <span class="vs-sep">vs</span>
              <span class="match-team-name ${w2?"won":w1?"lost":""}" ${isMyTeam(t2)?`style="color:#FF6B3D"`:""}>${isMyTeam(t2)?"★ ":""}${esc(t2)}</span>
            </div>
            <div class="score-box-wrap">${scoreHTML}</div>
          </div>
        </div>`;
    }).join("");

    return `
      <div class="round-block">
        <div class="round-header">
          <span class="round-label">Round ${roundNum}</span>
          <span class="round-bye ${byeIsMine?"round-bye-mine":""}">💤 ${byeIsMine?"★ ":""}${esc(byeName)} rests</span>
        </div>
        ${matchBlocks}
      </div>`;
  }).join("");

  return `
  <div class="pool-card" style="border-top:3px solid ${color}">
    <div class="pool-header">
      <div class="pool-name" style="color:${color}">Pool ${POOL_NAMES[pi]}</div>
      <div class="net-badge">Net ${pi+1}</div>
    </div>
    <table class="standings"><thead><tr><th>#</th><th>Team</th><th>W</th><th>L</th><th>PD</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="matches-section">
      <div class="matches-title">Matches (${done}/${matches.length})</div>
      ${matchRows}
    </div>
  </div>`;
}

/* ══════════════════════════════════════════════════════════════════════════
   RENDER — KO CARD (shared, admin flag gates editing)
══════════════════════════════════════════════════════════════════════════ */
function koCardHTML(m, stage, idx) {
  const labels   = {qf:`QF ${idx+1}`,sf:`SF ${idx+1}`,final:"🏆 Final"};
  const isFinal  = stage==="final";
  const tbd      = !m.t1 && !m.t2;
  const w1=m.status==="done"&&m.s1>m.s2, w2=m.status==="done"&&m.s2>m.s1;
  const isEd     = state.koEditing===m.id;
  const admin    = isAdmin();
  const seedings = {
    qf:["A1 vs D2","B1 vs C2","C1 vs B2","D1 vs A2"],
    sf:["QF1W vs QF2W","QF3W vs QF4W"],
    final:["SF1W vs SF2W"],
  };

  const teamRow = (name, won, lost)=>`
    <div class="ko-match-row">
      <span class="ko-team ${!name?"tbd":won?"won":lost?"lost":""}" ${isMyTeam(name)?`style="color:#FF6B3D"`:""}>
        ${isMyTeam(name)?"★ ":""}${esc(name)||"TBD"}${won?` <span style="margin-left:6px;font-size:.7rem">👑</span>`:""}
      </span>
      ${m.status==="done"?`<span class="ko-score" style="color:${won?"#C8F04A":"#5A7A5E"}">${won?m.s1:m.s2}</span>`:""}
    </div>`;

  let actionHTML;
  if (tbd) {
    actionHTML = `<span style="font-size:.75rem;color:#5A7A5E;display:block;margin-top:10px">Awaiting results</span>`;
  } else if (!admin) {
    // viewer: just show live pill if in progress
    actionHTML = m.status==="done" ? "" : `<span class="pending-pill" style="margin-top:10px;display:inline-block">Upcoming</span>`;
  } else if (isEd) {
    actionHTML = `<div class="score-box" style="gap:6px;margin-top:12px">
      <input class="score-inp" id="ko_s1_${m.id}" type="number" min="0" value="${state.koScores.s1}" placeholder="0"/>
      <span style="color:#5A7A5E">–</span>
      <input class="score-inp" id="ko_s2_${m.id}" type="number" min="0" value="${state.koScores.s2}" placeholder="0"/>
      <button class="btn btn-save" onclick="submitKOScore('${stage}','${m.id}')">✓</button>
      <button class="btn btn-cancel" onclick="cancelKOEdit()">✕</button>
    </div>`;
  } else if (m.status==="done") {
    actionHTML = `<div style="display:flex;gap:6px;margin-top:10px">
      <button class="btn btn-ghost" onclick="startKOEdit('${stage}','${m.id}',${m.s1},${m.s2})">Edit Score</button>
      <button class="btn btn-reset" onclick="if(confirm('Reset this match?'))resetKOMatch('${stage}','${m.id}')">↺ Reset</button>
    </div>`;
  } else {
    actionHTML = `<button class="btn btn-go" style="margin-top:10px" onclick="startKOEdit('${stage}','${m.id}','','')">Enter Score</button>`;
  }

  return `
  <div class="ko-card ${isFinal?"final-card":""}">
    <div class="ko-label">
      <span>${labels[stage]}</span>
      ${tbd?`<span style="color:#5A7A5E;font-size:.65rem">(${seedings[stage][idx]})</span>`:""}
    </div>
    ${teamRow(m.t1,w1,w2)}
    ${teamRow(m.t2,w2,w1)}
    ${actionHTML}
  </div>`;
}

    </div>`;

  let content = "";

  /* ── SETUP TAB (admin only) ── */
  if (tab==="setup" && admin) {
    const alreadyStarted = !!pools;
    const poolSetup = POOL_NAMES.map((pn,pi)=>{
      const currentNames = pools ? pools.teams[pi] : state.teamNames[pi];
      const inputs = currentNames.map((name,ti)=>`
        <div class="setup-team-row">
          <input class="setup-inp" value="${esc(name)}" placeholder="Team ${ti+1}"
            oninput="updateTeamName(${pi},${ti},this.value)"/>
          <button class="me-btn ${state.myTeam.pool===pi&&state.myTeam.idx===ti?"on":"off"}"
            onclick="setMyTeam(${pi},${ti})">
            ${state.myTeam.pool===pi&&state.myTeam.idx===ti?"YOU ★":"Me"}
          </button>
        </div>`).join("");
      return `
        <div class="setup-card" style="border-top:3px solid ${POOL_COLORS[pi]}">
          <div class="setup-pool-title" style="color:${POOL_COLORS[pi]}">
            Pool ${pn} <span style="color:#5A7A5E;font-size:.8rem">· Net ${pi+1}</span>

      const poolTeams = (state.teamsData[pi] || []);

      const teamRows = poolTeams.map((team, ti) => {
        const teamLabel = pools ? pools.teams[pi][ti] : (state.teamNames[pi][ti] || `Team ${ti+1}`);

        if (admin) {
          // Editable: team name (propagates to pool) + male/female players
          const playerInputs = [
            { idx:0, gender:"male",   label:"♂ Male",   icon:"👨", color:"#4DD9E8" },
            { idx:1, gender:"female", label:"♀ Female", icon:"👩", color:"#B57BFF" },
          ].map(({idx,label,icon,color}) => `
            <div class="player-row">
              <span class="gender-badge" style="background:${color}18;color:${color};border:1px solid ${color}44">${label}</span>
              <input class="player-inp" value="${esc(team.players?.[idx]||'')}"
                placeholder="${icon} Player name"
                oninput="updatePlayer(${pi},${ti},${idx},this.value)"/>
            </div>`).join("");

          return `
            <div class="team-entry">
              <div class="team-entry-hdr" style="border-left:3px solid ${color}">
                <input class="team-name-inp" value="${esc(teamLabel)}"
                  placeholder="Team name"
                  oninput="updateTeamNameLive(${pi},${ti},this.value)"
                  style="background:transparent;border:none;border-bottom:1px solid ${color}55;color:var(--text);
                    font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:700;letter-spacing:1px;
                    flex:1;outline:none;padding:2px 4px;min-width:0;"/>
                <span class="team-entry-badge" style="background:${color}22;color:${color};border:1px solid ${color}44">Pool ${pn}</span>
              </div>
              <div class="player-list">${playerInputs}</div>
            </div>`;
        } else {
          // View only
          const male   = (team.players||[])[0]?.trim() || "";
          const female = (team.players||[])[1]?.trim() || "";
          const complete = male && female;
          const playerList = `
            <div class="player-view-row">
              <span class="gender-badge" style="background:#4DD9E818;color:#4DD9E8;border:1px solid #4DD9E844">♂ Male</span>
              <span style="${!male?"color:#5A7A5E;font-style:italic":""}">${esc(male)||"Not listed"}</span>
            </div>
            <div class="player-view-row" style="border-bottom:none">
              <span class="gender-badge" style="background:#B57BFF18;color:#B57BFF;border:1px solid #B57BFF44">♀ Female</span>
              <span style="${!female?"color:#5A7A5E;font-style:italic":""}">${esc(female)||"Not listed"}</span>
            </div>
            ${!complete?`<div style="font-size:.7rem;color:#FF6B3D;margin-top:6px">⚠ Roster incomplete</div>`:""}
          `;

          return `
            <div class="team-entry">
              <div class="team-entry-hdr" style="border-left:3px solid ${color}">
                <span class="team-entry-name">${esc(teamLabel)}</span>
                <span class="team-entry-badge" style="background:${color}22;color:${color};border:1px solid ${color}44">Pool ${pn}</span>
              </div>
              <div class="player-list">${playerList}</div>
            </div>`;
        }
      }).join("");

      return `
        <div class="teams-pool-section">
          <div class="teams-pool-title" style="color:${color}">
            Pool ${pn} <span style="color:#5A7A5E;font-weight:400;font-size:.85rem">· Net ${pi+1}</span>
          </div>
          <div class="teams-grid">${teamRows}</div>
        </div>`;
    }).join("");

    const saveBtn = admin
      ? `<button class="btn btn-save btn-lg" onclick="saveTeamsData()">💾 Save Roster & Team Names</button>` : "";

    content = `
      <div style="margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
        <span class="tag">${admin ? "Edit team names · 1 male + 1 female per team · Changes sync everywhere" : "Team rosters · Mixed pairs format"}</span>
        ${admin ? `<span style="font-size:.75rem;color:#5A7A5E">Changes sync live to all viewers</span>` : ""}
      </div>
      ${teamCards}
      ${saveBtn}`;
  }

  return `${hdr}${tabs}<div class="content">${content}</div>`;
}

/* ══════════════════════════════════════════════════════════════════════════
   MAIN RENDER
══════════════════════════════════════════════════════════════════════════ */
function render() {
  const root = document.getElementById("root");
  if (state.role==="landing") {
    root.innerHTML = renderLanding();
  } else {
    // admin: if no pools yet, default to setup tab
    if (isAdmin() && !state.pools && state.tab!=="setup") state.tab = "setup";
    root.innerHTML = renderTournament();
  }
  // Re-attach pin modal if on landing
  if (state.pinError) {
    const err = document.getElementById("pin-error");
    if (err) err.style.display = "block";
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   GLOBAL HANDLERS
══════════════════════════════════════════════════════════════════════════ */
window.enterViewer = () => {
  state.role = "viewer";
  state.tab  = "pools";
  startFirebaseListener();
  render();
};

window.showPinModal = () => {
  // Remove any existing modal first
  document.getElementById("pin-modal")?.remove();
  // Inject modal directly into body so it works from any view
  const div = document.createElement("div");
  div.id = "pin-modal";
  div.className = "modal-overlay";
  div.style.display = "flex";
  div.onclick = (e) => { if (e.target.id === "pin-modal") window.closePinModal(); };
  div.innerHTML = `
    <div class="modal-box">
      <div class="modal-title">🔐 Admin Access</div>
      <div class="modal-sub">Enter the admin PIN to continue</div>
      <input class="pin-inp" id="pin-input" type="password" inputmode="numeric"
        maxlength="8" placeholder="••••" onkeydown="if(event.key==='Enter')submitPin()"/>
      <div id="pin-error" class="pin-error" style="display:none">Incorrect PIN — try again</div>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="btn btn-save" style="flex:1" onclick="submitPin()">Unlock</button>
        <button class="btn btn-cancel" style="flex:1" onclick="closePinModal()">Cancel</button>
      </div>
    </div>`;
  document.body.appendChild(div);
  setTimeout(() => document.getElementById("pin-input")?.focus(), 80);
};

window.closePinModal = (e) => {
  if (e && e.target?.id !== "pin-modal") return;
  document.getElementById("pin-modal")?.remove();
  state.pinError = false;
};

window.submitPin = () => {
  const val = document.getElementById("pin-input")?.value || "";
  if (val === ADMIN_PIN) {
    document.getElementById("pin-modal")?.remove();
    state.role = "admin";
    state.tab  = state.pools ? "pools" : "setup";
    state.pinError = false;
    startFirebaseListener();
    render();
  } else {
    state.pinError = true;
    const err = document.getElementById("pin-error");
    const inp = document.getElementById("pin-input");
    if (err) err.style.display = "block";
    if (inp) { inp.value = ""; inp.focus(); }
  }
};

window.switchRole = (role) => {
  state.role = role;
  state.editingMatch = null;
  state.koEditing = null;
  render();
};

window.updateTeamName = (pi,ti,val)=>{
  state.teamNames[pi][ti]=val;
  // Also update pools.teams live if tournament already started
  if (state.pools?.teams?.[pi]) state.pools.teams[pi][ti] = val;
};
window.setMyTeam      = (pi,ti)=>{ state.myTeam={pool:pi,idx:ti}; render(); };
window.setTab         = (t)=>{ state.tab=t; render(); };
window.startTournament   = startTournament;
window.advanceToKnockout = advanceToKnockout;
window.toggleLive        = (pi,id)=>toggleLive(pi,id);
window.resetPoolMatch    = (pi,id)=>resetPoolMatch(pi,id);
window.resetKOMatch      = (stage,id)=>resetKOMatch(stage,id);

window.confirmGenerate = () => {
  if (state.pools) {
    if (!confirm("This will reset ALL scores and matches. Team names will be kept. Continue?")) return;
  }
  startTournament();
};

window.updatePlayer = (pi, ti, playerIdx, val) => {
  if (!state.teamsData[pi]) state.teamsData[pi] = [];
  if (!state.teamsData[pi][ti]) state.teamsData[pi][ti] = { teamName: "", players: [] };
  if (!state.teamsData[pi][ti].players) state.teamsData[pi][ti].players = [];
  state.teamsData[pi][ti].players[playerIdx] = val;
};

window.updateTeamNameLive = (pi, ti, val) => {
  // Update teamNames (pre-tournament) and pools.teams (post-tournament) simultaneously
  state.teamNames[pi][ti] = val;
  if (state.teamsData[pi] && state.teamsData[pi][ti]) {
    state.teamsData[pi][ti].teamName = val;
  }
  if (state.pools && state.pools.teams[pi]) {
    state.pools.teams[pi][ti] = val;
    // Also update any KO match references to this team name
    const oldName = state.pools.teams[pi][ti]; // already updated above
    // KO names are stored as strings — they get set at advanceToKnockout time,
    // so we just update the live pools.teams reference here.
  }
};

window.saveTeamsData = () => {
  // Push all team name changes into pools.teams and sync everything
  if (state.pools) {
    state.teamsData.forEach((poolTeams, pi) => {
      poolTeams.forEach((team, ti) => {
        const name = team.teamName?.trim();
        if (name) {
          state.pools.teams[pi][ti] = name;
          state.teamNames[pi][ti] = name;
        }
      });
    });
    // Sync match data too so team name changes are reflected in pool standings
    syncToFirebase({ pools: state.pools, phase: state.phase });
  }
  syncTeamsData();
  const btn = document.querySelector('.btn-save.btn-lg');
  if (btn) { btn.textContent = "✓ Saved & Synced!"; setTimeout(()=>{ btn.textContent = "💾 Save Roster & Team Names"; },2000); }
};

window.startEdit = (pi,id,s1,s2)=>{
  state.editingMatch=id; state.editScores={s1,s2}; render();
  setTimeout(()=>document.getElementById(`s1_${id}`)?.focus(),50);
};
window.cancelEdit = ()=>{ state.editingMatch=null; render(); };
window.submitPoolScore = (pi,id)=>{
  const el1 = document.getElementById(`s1_${id}`);
  const el2 = document.getElementById(`s2_${id}`);
  const s1 = (el1 && el1.value !== "") ? parseInt(el1.value, 10) : NaN;
  const s2 = (el2 && el2.value !== "") ? parseInt(el2.value, 10) : NaN;
  if (!Number.isInteger(s1)||!Number.isInteger(s2)||s1<0||s2<0){ alert("Please enter valid scores (0 or above)."); return; }
  if (s1===s2){ alert("Scores can't be equal — no ties in beach volleyball!"); return; }
  savePoolScore(parseInt(pi),id,s1,s2);
};

window.startKOEdit = (stage,id,s1,s2)=>{
  state.koEditing=id; state.koScores={s1,s2}; render();
  setTimeout(()=>document.getElementById(`ko_s1_${id}`)?.focus(),50);
};
window.cancelKOEdit = ()=>{ state.koEditing=null; render(); };
window.submitKOScore = (stage,id)=>{
  const el1 = document.getElementById(`ko_s1_${id}`);
  const el2 = document.getElementById(`ko_s2_${id}`);
  const s1 = (el1 && el1.value !== "") ? parseInt(el1.value, 10) : NaN;
  const s2 = (el2 && el2.value !== "") ? parseInt(el2.value, 10) : NaN;
  if (!Number.isInteger(s1)||!Number.isInteger(s2)||s1<0||s2<0){ alert("Please enter valid scores (0 or above)."); return; }
  if (s1===s2){ alert("Scores can't be equal — no ties!"); return; }
  saveKOScore(stage,id,s1,s2);
};

/* boot */
if (isConfigured) {
  // Show a loading screen until Firebase responds, then render
  document.getElementById("root").innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;
      min-height:80vh;gap:16px;color:#5A7A5E;font-family:'Karla',sans-serif;">
      <div style="font-size:3rem">🏐</div>
      <div style="font-size:.85rem;letter-spacing:2px;text-transform:uppercase">Connecting to Firebase…</div>
    </div>`;
  startFirebaseListener();
} else {
  render();
}
</script>

<style>
:root{

  --accent:#C8F04A;--coral:#FF6B3D;--sky:#4DD9E8;--purple:#B57BFF;

.landing-cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;width:100%;max-width:560px;}

.role-card{flex:1;min-width:220px;background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:28px 20px;cursor:pointer;transition:all .2s;text-align:center;}

/* ── ROLE PILLS ── */

  font-size:.8rem;color:#FF6B3D;margin:16px 0;}

  font-size:.78rem;color:#27AE60;margin:14px 0;}

.pool-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.pool-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);}
.pool-name{font-family:'Barlow Condensed',sans-serif;font-size:1.3rem;font-weight:900;letter-spacing:3px;}
.net-badge{font-size:.65rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);
  background:var(--surface);border:1px solid var(--border);padding:4px 10px;border-radius:20px;}

/* ── STANDINGS ── */

  padding:2px 6px;border-radius:10px;margin-left:5px;display:inline-block;}

/* ── MATCHES ── */
.matches-section{padding:12px 16px;}
.matches-title{font-family:'Barlow Condensed',sans-serif;font-size:.78rem;letter-spacing:2px;color:var(--muted);
  text-transform:uppercase;margin-bottom:8px;}
.match-block{padding:3px 0;}

.btn-save:hover{opacity:.85;}
.btn-cancel{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-cancel:hover{border-color:var(--dim);color:var(--text);}
.btn-lg{font-size:1rem;padding:13px 28px;border-radius:10px;width:100%;margin-top:20px;}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--dim);font-size:.75rem;padding:4px 10px;border-radius:6px;}
.btn-ghost:hover{border-color:var(--dim);color:var(--text);}
.btn-sm{font-size:.72rem;padding:3px 9px;}
.btn-reset{background:transparent;border:1px solid #5A7A5E55;color:#5A7A5E;font-size:.75rem;
  padding:4px 9px;border-radius:6px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;
  font-weight:600;letter-spacing:1px;transition:all .15s;}
.btn-reset:hover{border-color:var(--coral);color:var(--coral);}

/* ── PROGRESS ── */
.progress-row{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.progress-bar{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--sky));transition:width .4s ease;}
.progress-label{font-size:.75rem;color:var(--muted);white-space:nowrap;}

/* ── KNOCKOUT ── */
.ko-section{margin-bottom:32px;}
.ko-title{font-family:'Barlow Condensed',sans-serif;font-size:1.5rem;font-weight:900;letter-spacing:3px;
  color:var(--accent);margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.ko-title-bar{flex:1;height:1px;background:var(--border);}
.ko-grid{display:grid;gap:12px;}
.ko-grid-4{grid-template-columns:1fr 1fr;}
.ko-grid-2{grid-template-columns:1fr 1fr;}
.ko-grid-1{grid-template-columns:1fr;}
@media(max-width:560px){.ko-grid-4,.ko-grid-2{grid-template-columns:1fr;}}
.ko-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;}
.ko-card.final-card{border-color:#FFD16655;background:#1E1A08;}
.ko-label{font-family:'Barlow Condensed',sans-serif;font-size:.75rem;letter-spacing:2px;color:var(--muted);
  text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:7px;}
.ko-match-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);}
.ko-match-row:last-of-type{border-bottom:none;}
.ko-team{font-size:.88rem;flex:1;}
.ko-team.tbd{color:var(--muted);font-style:italic;}
.ko-team.won{color:var(--accent);font-weight:600;}
.ko-team.lost{color:var(--muted);}
.ko-score{font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;min-width:28px;text-align:center;}

/* ── CHAMPION ── */
.champion-banner{background:linear-gradient(135deg,#1E1A08,#2A2408);border:1px solid var(--gold);
  border-radius:16px;padding:32px;text-align:center;margin-bottom:28px;}
.champion-icon{font-size:3rem;margin-bottom:8px;}
.champion-label{font-family:'Barlow Condensed',sans-serif;font-size:.85rem;letter-spacing:3px;color:var(--gold);
  text-transform:uppercase;margin-bottom:6px;}
.champion-name{font-family:'Barlow Condensed',sans-serif;font-size:2.8rem;font-weight:900;color:var(--gold);letter-spacing:2px;}

/* ── SETUP ── */
.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:600px){.setup-grid{grid-template-columns:1fr;}}
.setup-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;}
.setup-pool-title{font-family:'Barlow Condensed',sans-serif;font-size:1.15rem;font-weight:700;letter-spacing:2px;margin-bottom:12px;}
.setup-team-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.setup-inp{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:7px;
  color:var(--text);font-family:'Karla',sans-serif;font-size:.87rem;padding:7px 12px;outline:none;}
.setup-inp:focus{border-color:var(--accent);}
.me-btn{font-size:.65rem;letter-spacing:1px;padding:5px 9px;border-radius:6px;border:none;cursor:pointer;
  transition:all .15s;font-family:'Barlow Condensed',sans-serif;}
.me-btn.on{background:var(--coral);color:#fff;}
.me-btn.off{background:var(--surface);border:1px solid var(--border);color:var(--muted);}

/* ── MISC ── */
.content{padding-top:4px;}
.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-icon{font-size:3rem;margin-bottom:10px;}
.tag{font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);}

/* ── TEAMS TAB ── */
.teams-pool-section{margin-bottom:32px;}
.teams-pool-title{font-family:'Barlow Condensed',sans-serif;font-size:1.4rem;font-weight:900;
  letter-spacing:3px;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.teams-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:600px){.teams-grid{grid-template-columns:1fr;}}
.team-entry{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.team-entry-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;background:var(--surface);gap:8px;}
.team-entry-name{font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:700;
  letter-spacing:1px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.team-entry-badge{font-size:.62rem;letter-spacing:1.5px;text-transform:uppercase;
  padding:3px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0;}
.player-list{padding:10px 14px;}
.player-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.player-row:last-child{margin-bottom:0;}
.gender-badge{font-family:'Barlow Condensed',sans-serif;font-size:.72rem;font-weight:700;
  letter-spacing:1.5px;padding:3px 9px;border-radius:10px;white-space:nowrap;flex-shrink:0;min-width:72px;text-align:center;}
.player-inp{flex:1;background:#0C1A14;border:1px solid var(--border);border-radius:6px;
  color:var(--text);font-family:'Karla',sans-serif;font-size:.83rem;padding:6px 10px;outline:none;}
.player-inp:focus{border-color:var(--accent);}
.player-inp::placeholder{color:#3A5A3E;}
.player-view-row{display:flex;align-items:center;gap:10px;padding:6px 0;
  border-bottom:1px solid #1E3A20;font-size:.85rem;}
.player-view-row:last-child{border-bottom:none;}
</style>
